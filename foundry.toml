[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000
fuzz.runs = 256
invariant.runs = 128
invariant.depth = 64
fs_permissions = [{ access = "read", path = "./registry" }]

[profile.ci]
fuzz.runs = 2_000
invariant.runs = 512
invariant.depth = 128

[lint]
exclude_lints = ["screaming-snake-case-immutable"]
